    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: |-
            	CREATE OR REPLACE VIEW {{ ref('TEST_SRC', 'STG_CUSTOMER_HASH_DIFF')}} AS (
            		WITH src AS (
            			SELECT
            				s."CUSTOMER_ID",
            				s."NAME",
            				s."ADDRESS",
            				s."PHONE",
            				s."EMAIL",
            				s."LAST_UPDATED",
            				s."RECORD_HASH"
            			FROM  {{ ref('TEST_SRC', 'STG_SRC_CUSTOMER_CHANGES_HASH') }} s
            		)
            		SELECT 
            			src."CUSTOMER_ID",
            			src."NAME",
            			src."ADDRESS",
            			src."PHONE",
            			src."EMAIL",
            			src."LAST_UPDATED",
            			src."RECORD_HASH"
            		FROM src
            		LEFT JOIN {{ ref('TEST_SRC', 'STG_SRC_CUSTOMER_CHANGES_HASH_HISTORY') }} t
            			ON src."CUSTOMER_ID" = t."CUSTOMER_ID"
            		WHERE t."RECORD_HASH" IS NULL
            		OR src."RECORD_HASH" <> t."RECORD_HASH"
            	)
