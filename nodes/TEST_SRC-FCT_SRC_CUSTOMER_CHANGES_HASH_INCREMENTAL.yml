operation:
  config:
    clusterKey: false
    postSQL: |-
      MERGE INTO {{ ref('TEST_SRC', 'FCT_SRC_CUSTOMER_CHANGES_HASH_INCREMENTAL') }} AS T
      USING {{ ref('TEST_SRC', 'STG_SRC_CUSTOMER_CHANGES_HASH') }} AS S
      ON T.CUSTOMER_ID = S.CUSTOMER_ID
      
      WHEN MATCHED AND T.RECORD_HASH <> S.RECORD_HASH THEN
          UPDATE SET
              T.NAME = S.NAME,
              T.ADDRESS = S.ADDRESS,
              T.PHONE = S.PHONE,
              T.EMAIL = S.EMAIL,
              T.LAST_UPDATED = S.LAST_UPDATED,
              T.RECORD_HASH = S.RECORD_HASH
      
      WHEN NOT MATCHED THEN
          INSERT (CUSTOMER_ID, NAME, ADDRESS, PHONE, EMAIL, LAST_UPDATED, RECORD_HASH)
          VALUES (S.CUSTOMER_ID, S.NAME, S.ADDRESS, S.PHONE, S.EMAIL, S.LAST_UPDATED, S.RECORD_HASH);
